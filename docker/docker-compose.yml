name: relio-app

services:
  relio:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
      - ../config.json:/app/config.json:ro
    restart: unless-stopped
